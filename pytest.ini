[pytest]
# The check suites in test_*.py are script-style: they assert at module level
# and signal failure with a non-zero exit code. test_suites.py runs each of them
# as a subprocess, so pytest must not try to import them directly.
#
# Limiting collection to the wrapper also removes two false positives that come
# from importing engine/registry.py: the production helper test_count(), whose
# name only looks like a test, and the TestOutcome dataclass, which pytest would
# otherwise try to collect as a test class.
python_files = test_suites.py
testpaths = .
